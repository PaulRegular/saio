  <title id="logo-title">SAIO — Stock Assessment Input and Output</title>
  <desc id="logo-description">A blue isometric database stack inside a navy hexagon. Three ivory fish face left on successive tiers: Atlantic herring, Atlantic cod and American plaice. SAIO is set into the centre tier of the right face.</desc>
